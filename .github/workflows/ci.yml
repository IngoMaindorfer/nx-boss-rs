name: CI

on:
  push:
    branches: [main, rewrite/rust, "review/**"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: rustfmt check
        run: cargo fmt -- --check

      - name: Scanner OpenAPI contract
        run: python3 scripts/test_openapi.py

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: NX_BOSS_REQUIRE_HTTP_TESTS=1 cargo test --locked

  integration-test:
    name: Integration test (binary)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --locked --release

      - name: Create test config and scan dir
        run: |
          mkdir -p /tmp/nx-boss-scans
          cat > /tmp/nx-boss-test.yaml << 'EOF'
          jobs:
            Integration:
              output_path: /tmp/nx-boss-scans
              color: '#2196F3'
          EOF

      - name: Start server
        run: |
          python3 -c 'import os,pathlib; p=pathlib.Path("/tmp/nx-boss-auth-pepper"); p.write_bytes(os.urandom(32)); p.chmod(0o600)'
          export NX_BOSS_AUTH_PEPPER_FILE=/tmp/nx-boss-auth-pepper
          ./target/release/nx-boss-rs --config /tmp/nx-boss-test.yaml &
          echo $! > /tmp/nx-boss.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:10447/NmWebService/heartbeat && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10448/)" = 303

      - name: Check route isolation
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10447/jobs)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10448/NmWebService/heartbeat)" = 404

      - name: Run integration test
        run: bash scripts/test_scan.sh 127.0.0.1:10447 /tmp/nx-boss-scans

      - name: Test graceful shutdown and scan recovery
        run: python3 scripts/test_shutdown.py ./target/release/nx-boss-rs

      - name: Test structured logs and secret redaction
        run: python3 scripts/test_logging.py ./target/release/nx-boss-rs

      - name: Stop server
        if: always()
        run: kill $(cat /tmp/nx-boss.pid) 2>/dev/null || true

  browser-test:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-browser-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-browser-cargo-

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build test server
        run: cargo build --locked

      - name: Run browser tests
        run: npm run test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  docker-build:
    name: Docker build (smoke test)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Install tested Compose version
        uses: docker/setup-compose-action@v2.4.0
        with:
          version: v5.5.1

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          python3 scripts/test_compose_boundary.py
          python3 scripts/test_caddy_mounts.py

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: false
          load: true
          tags: nx-boss-rs:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Caddy and validate DNS-01 configuration
        run: |
          mkdir -p secrets
          printf '%s\n' 'cfut_123456789012345678901234567890123456789012345678' > secrets/cloudflare_api_token
          chmod 600 secrets/cloudflare_api_token
          docker build --target caddy -t nx-boss-caddy:cloudflare-a8737d0 .
          bash scripts/test_caddy_dns.sh

      - name: Smoke test Compose listeners and healthcheck
        run: |
          python3 -c 'import os,pathlib; p=pathlib.Path("secrets/auth_pepper"); p.parent.mkdir(exist_ok=True); p.write_bytes(os.urandom(32)); p.chmod(0o600)'
          cat > deploy/Caddyfile << 'EOF'
          {
            admin off
            auto_https disable_redirects
            default_sni 127.0.0.2
            skip_install_trust
          }
          https://127.0.0.2:{$NX_BOSS_ADMIN_HTTPS_PORT} {
            tls internal
            reverse_proxy nx-boss-rs:{$NX_BOSS_UPSTREAM_ADMIN_PORT}
          }
          http://:{$NX_BOSS_SCANNER_HTTP_PORT} {
            reverse_proxy nx-boss-rs:{$NX_BOSS_UPSTREAM_SCANNER_PORT}
          }
          https://127.0.0.2:{$NX_BOSS_SCANNER_HTTPS_PORT} {
            tls internal
            reverse_proxy nx-boss-rs:{$NX_BOSS_UPSTREAM_SCANNER_PORT}
          }
          EOF
          mkdir -p config scans
          cat > config/config.yaml << 'EOF'
          jobs:
            Smoke:
              output_path: /data
          EOF
          printf 'NX_BOSS_UID=%s\nNX_BOSS_GID=%s\nNX_BOSS_IMAGE=nx-boss-rs:ci\nNX_BOSS_SERVER_IP=127.0.0.2\nNX_BOSS_ADMIN_IP=127.0.0.2\nNX_BOSS_SCANNER_PORT=21447\nNX_BOSS_SCANNER_HTTPS_PORT=21448\nNX_BOSS_ADMIN_HTTPS_PORT=8443\nNX_BOSS_INTERNAL_SCANNER_PORT=11447\nNX_BOSS_INTERNAL_ADMIN_PORT=11448\n' "$(id -u)" "$(id -g)" > .env
          chmod 700 config scans
          chmod 600 config/config.yaml .env
          trap 'docker compose down' EXIT
          docker compose up -d --no-build nx-boss-rs
          for i in $(seq 1 30); do
            if docker compose exec -T nx-boss-rs /nx-boss-rs --healthcheck --port 11447; then break; fi
            sleep 1
          done
          docker compose exec -T nx-boss-rs /nx-boss-rs --healthcheck --port 11447
          if docker compose up -d --no-build caddy > /tmp/nx-boss-missing-caddy.log 2>&1; then
            cat /tmp/nx-boss-missing-caddy.log
            echo 'Caddy started without explicit storage directories' >&2
            exit 1
          fi
          test ! -e caddy-acme
          mkdir -p caddy-acme/data caddy-acme/config
          chmod 700 caddy-acme caddy-acme/data caddy-acme/config
          docker compose up -d --no-build --wait --wait-timeout 120
          curl --noproxy '*' -fsS http://127.0.0.2:21447/health >/dev/null
          NO_PROXY=127.0.0.2 bash scripts/test_scan.sh 127.0.0.2:21447 scans
          for i in $(seq 1 30); do
            if docker compose exec -T caddy cat /data/caddy/pki/authorities/local/root.crt > /tmp/nx-boss-root.crt 2>/dev/null; then break; fi
            sleep 1
          done
          test -s /tmp/nx-boss-root.crt
          curl --noproxy '*' --cacert /tmp/nx-boss-root.crt -fsS https://127.0.0.2:8443/ >/dev/null
          curl --noproxy '*' --cacert /tmp/nx-boss-root.crt -fsS https://127.0.0.2:21448/health >/dev/null
          CURL_CA_BUNDLE=/tmp/nx-boss-root.crt NO_PROXY=127.0.0.2 bash scripts/test_scan.sh https://127.0.0.2:21448 scans
          test "$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' https://127.0.0.2:10448/)" = 000
          test "$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' http://127.0.0.2:21447/jobs)" = 404
          test "$(curl --noproxy '*' --cacert /tmp/nx-boss-root.crt -s -o /dev/null -w '%{http_code}' https://127.0.0.2:8443/NmWebService/heartbeat)" = 404
          test "$(curl --noproxy '*' --cacert /tmp/nx-boss-root.crt -s -o /dev/null -w '%{http_code}' https://127.0.0.2:21448/jobs)" = 404
          for i in $(seq 1 30); do
            if test "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q caddy)")" = healthy; then break; fi
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q caddy)")" = healthy
