[package]
name = "nx-boss-rs"
version = "0.1.5"
edition = "2024"
description = "Compatible server for PaperStream NX Manager"
repository = "https://github.com/IngoMaindorfer/nx-boss-rs"

[[bin]]
name = "nx-boss-rs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
uuid = { version = "1.29.0", features = ["v4", "v6"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
lopdf = { version = "0.46.0", default-features = false }
tar = "0.4.46"
zstd = "0.14.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
askama = "0.16.1"
indexmap = { version = "2.14.2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
argon2 = { version = "0.6.0", features = ["getrandom"] }
getrandom = "0.4.3"
webauthn-rs = "0.6.2"
openssl = { version = "0.10.81", features = ["vendored"] }
chrono-tz = "0.10.4"
subtle = "2.6.1"
sha2 = "0.11.0"

[dev-dependencies]
axum-test = "21.1.0"
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
